<!DOCTYPE html>
<html>
  <head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/index.css" />
    <script src="assets/index.js"></script>
    <title>SVG Demo</title>
  </head>
  <body>
    Circle:
    <svg
      width="100"
      height="100"
      viewBox="0 0 200 200"
    >
      <circle 
        cx="100"
        cy="100" 
        r="50" 
        fill="red" 
        class="circle"
        />
    </svg>  
    <hr/>
    Rectangle / Bar Graph:
    <svg
      width="200"
      height="200"
      viewBox="0 0 200 200"  
    >
      <rect
        y="110"
        x="0"
        width="40"
        height="200"
        fill="blue"
      />
      <rect
        y="130"
        x="50"
        width="40"
        height="200"
        fill="blue"
      />
      <rect
        y="90"
        x="100"
        width="40"
        height="200"
        fill="blue"
      />
      <rect
        y="70"
        x="150"
        width="40"
        height="200"
        fill="blue"
      />
    </svg>
    <hr/>
    Path / Hamburger Icon:
    <svg
      width="250"
      height="250"
      viewBox="0 0 250 250"
    >
      <path
        class="line"
        d="
          M 50, 100 L 150, 100
          M 50, 150 L 150, 150
          M 50, 200 L 150, 200
        "
      />
    </svg>
    <hr/>
    Reusing path using use:
    <svg
      width="200"
      height="200"
      viewBox="-15 -15 30 30"
    >
      <circle r="6"/>
      <path id="ray" d="M 0, 11 L 0, 14"/>
      <use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(325)"/>
    </svg>
  </body>
</html>
